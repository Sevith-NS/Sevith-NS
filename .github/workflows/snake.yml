name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#26619C&color_dots=#EFE9DD,#B9CDE6,#7FA6D3,#3F78B5,#0B1B3F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EFE9DD&color_dots=#161b22,#0B1B3F,#1B3D6E,#26619C,#6FA3D8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
